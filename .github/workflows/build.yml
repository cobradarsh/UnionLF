# Builds Wingman Plus for RootHide on macOS with Xcode's toolchain.
#
# WHY macOS (not Linux any more): SpringBoard is an arm64e PLATFORM binary built
# with the *versioned* ptrauth ABI (cpusubtype 0x80000002). The Linux theos
# toolchain emits arm64e tagged with the old "preview" ABI (0x00000002), and dyld
# silently refuses that into SpringBoard - so every Linux build installed but never
# loaded. Xcode's clang produces the versioned ABI automatically, exactly like
# Snapper (the known-good reference tweak). A verification gate below fails the
# build unless the arm64e slice is 0x80000002, so we can never ship a silent dud.
name: Build Wingman (RootHide)
on:
  push:
    branches: [main, wingman-plus]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers || true
          xcodebuild -version || true
          clang --version || true

      - name: Install packaging deps (ldid, xz, dpkg)
        run: |
          brew update || true
          brew install ldid xz dpkg || true
          echo "ldid: $(command -v ldid)  xz: $(command -v xz)  dpkg-deb: $(command -v dpkg-deb)"
          ldid -V || true

      - name: Install RootHide Theos (git clone; avoids install-theos SDK API call)
        run: |
          export THEOS=$HOME/theos
          # install-theos auto-downloads SDKs via api.github.com, which rate-limits
          # on shared runner IPs (exit 8). A plain recursive clone is a complete,
          # working theos; on macOS it uses Xcode's clang (versioned arm64e) with no
          # separate toolchain. We provide the SDK ourselves in the next step.
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" submodule update --init --recursive
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Get iOS 16.5 SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          cd "$HOME/theos/sdks"
          curl -fsSL -o iPhoneOS16.5.sdk.tar.xz \
            https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz
          tar xf iPhoneOS16.5.sdk.tar.xz
          ls -d iPhoneOS*.sdk

      - name: Run logic tests
        run: python3 tests/test_wingman.py

      - name: Build the .deb (Xcode clang => versioned arm64e)
        run: |
          export THEOS="$HOME/theos"
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS="arm64 arm64e" 2>&1 | tee build.log
          echo "=== produced debs ==="
          ls -la packages/ || true

      - name: Verify arm64e slice is the VERSIONED ptrauth ABI (gate)
        run: |
          DY=$(find . -path '*DynamicLibraries/WingmanPlus.dylib' | head -1)
          if [ -z "$DY" ]; then DY=$(find . -name 'WingmanPlus.dylib' | grep -v '\.dSYM' | head -1); fi
          echo "dylib under test: $DY"
          lipo -detailed_info "$DY" || true
          otool -f -v "$DY" || true
          python3 tools/verify_arm64e.py "$DY"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: wingmanplus-roothide-deb
          path: packages/*.deb
