# Builds BluetoothNoClicks for RootHide on macOS with Xcode's toolchain.
#
# Same recipe as Wingman Plus and Dynamic Stage+: Xcode's clang tags the arm64e slice with
# the VERSIONED ptrauth ABI (cpusubtype 0x80000002), which dyld requires before it will load
# a dylib into arm64e platform processes (SpringBoard). The gate step below fails the build
# unless that slice is present, so a silent dud never ships.
name: Build BluetoothNoClicks (RootHide)
on:
  push:
    branches: [bt-noclicks]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers || true
          xcodebuild -version || true
          clang --version || true

      - name: Install packaging deps (ldid, xz, dpkg)
        run: |
          brew update || true
          brew install ldid xz dpkg || true
          echo "ldid: $(command -v ldid)  xz: $(command -v xz)  dpkg-deb: $(command -v dpkg-deb)"

      - name: Install RootHide Theos (git clone)
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" submodule update --init --recursive
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Get iOS 16.5 SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          cd "$HOME/theos/sdks"
          curl -fsSL -o iPhoneOS16.5.sdk.tar.xz \
            https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz
          tar xf iPhoneOS16.5.sdk.tar.xz
          ls -d iPhoneOS*.sdk

      - name: Check the Settings page is the one the generator makes
        run: |
          python3 tools/make_prefs.py "$RUNNER_TEMP/prefs"
          python3 - "$RUNNER_TEMP/prefs/BluetoothNoClicks.plist" layout/Library/PreferenceLoader/Preferences/BluetoothNoClicks.plist <<'EOF'
          import plistlib, sys
          fresh, shipped = (plistlib.load(open(p, "rb")) for p in sys.argv[1:3])
          assert fresh == shipped, "layout/ is stale: run tools/make_prefs.py and commit the result"
          print("prefs OK:", [i["key"] for i in shipped["items"] if "key" in i])
          EOF

      - name: Build the .deb (Xcode clang => versioned arm64e)
        run: |
          export THEOS="$HOME/theos"
          make clean || true
          set -o pipefail
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS="arm64 arm64e" 2>&1 | tee build.log
          ls -la packages/

      - name: Verify arm64e slice is the VERSIONED ptrauth ABI (gate)
        run: |
          # the staged (fat) copy, not a thin per-arch one from .theos/obj/<arch>/
          DY=$(find . -path '*DynamicLibraries/BluetoothNoClicks.dylib' | head -1)
          [ -n "$DY" ] || DY=.theos/obj/BluetoothNoClicks.dylib
          echo "dylib under test: $DY"
          lipo -detailed_info "$DY" || true
          python3 tools/verify_arm64e.py "$DY"
          echo "--- links against ---"
          otool -arch arm64e -L "$DY" || true
          echo "--- hooked selectors present in the binary ---"
          strings -a "$DY" | grep -E "SoundForNotificationRequest|keyboard-audio|preferences\.sounds" || true

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bluetoothnoclicks-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: bluetoothnoclicks-roothide-deb
          path: packages/*.deb
