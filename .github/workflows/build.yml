# Builds Atelier for RootHide on macOS with Xcode's toolchain, and runs it in a simulator.
#
# Same recipe as Chakra and the other tweaks in this repository: Xcode's clang tags the arm64e
# slice with the VERSIONED ptrauth ABI (cpusubtype 0x80000002), which dyld requires before it
# will load a dylib into arm64e platform processes (SpringBoard). The gate step below fails the
# build unless that slice is present and the library links nothing but iOS's own libraries.
#
# The macOS jobs run on two kinds of runner at once: the hosted arm64 runners have been out of
# capacity before; whichever frees up first does the work, the other is the spare.
name: Build Atelier (RootHide)
on:
  push:
    branches: [atelier]
    paths-ignore:
      - README.md
  workflow_dispatch:

# a newer push replaces a run that is still waiting for a runner
concurrency:
  group: atelier-build
  cancel-in-progress: true

jobs:
  # A quick compile check on Linux (nothing is linked): Linux runners start at once, so a typo
  # shows up in a minute. Upstream clang against the iOS SDK headers, warnings as errors.
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Get iOS 16.5 SDK
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sdk.tar.xz" https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz
          mkdir -p "$RUNNER_TEMP/sdk"
          tar xf "$RUNNER_TEMP/sdk.tar.xz" -C "$RUNNER_TEMP/sdk"
          ls "$RUNNER_TEMP/sdk"

      - name: Compile every source (syntax only)
        run: |
          clang --version
          SDK="$RUNNER_TEMP/sdk/iPhoneOS16.5.sdk"
          fail=0
          for f in Tweak.m Atelier*.m PrefsHelper.m probe/main.m; do
            echo "== $f"
            clang -fsyntax-only -x objective-c -target arm64-apple-ios15.0 -isysroot "$SDK" -fobjc-arc \
              -Wall -Werror -Wno-deprecated-declarations -Wno-unused-variable -Wno-unused-function \
              -Wno-unused-but-set-variable -I. "$f" || fail=1
          done
          echo "== scripts"
          python3 -m py_compile tools/*.py || fail=1
          for f in tools/*.sh; do bash -n "$f" || fail=1; done
          python3 tools/layout_check.py || fail=1
          exit $fail

  # (A commit whose message has "[syntax only]" in it runs the Linux check alone.)
  build:
    if: ${{ !contains(github.event.head_commit.message, '[syntax only]') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers || true
          xcodebuild -version || true
          clang --version || true

      - name: Install packaging deps (ldid, xz)
        # Only what Theos needs: it signs with ldid and packs the .deb itself (dm.pl, lzma through xz).
        # ldid comes as a ready binary from its own releases; Homebrew is only the fallback (on Intel
        # runners Homebrew compiles its dependencies from source and runs into the time limit).
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          mkdir -p "$HOME/bin"
          if ! command -v ldid > /dev/null; then
            url="https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_$(uname -m)"
            curl -fsSL -o "$HOME/bin/ldid" "$url" || true
            if file "$HOME/bin/ldid" 2>/dev/null | grep -q "Mach-O"; then
              chmod +x "$HOME/bin/ldid"
            else
              echo "no ready-made ldid at $url: building it with Homebrew (slow on Intel)"
              rm -f "$HOME/bin/ldid"
              brew install ldid
            fi
          fi
          echo "$HOME/bin" >> "$GITHUB_PATH"
          command -v xz > /dev/null || brew install xz || true
          export PATH="$HOME/bin:$PATH"
          echo "ldid: $(command -v ldid)  xz: $(command -v xz)"

      - name: Install RootHide Theos (git clone)
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" submodule update --init --recursive
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Get iOS 16.5 SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          cd "$HOME/theos/sdks"
          curl -fsSL -o iPhoneOS16.5.sdk.tar.xz \
            https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz
          tar xf iPhoneOS16.5.sdk.tar.xz
          ls -d iPhoneOS*.sdk

      - name: Check the Settings page is the one the generator makes
        run: |
          python3 tools/make_prefs.py "$RUNNER_TEMP/prefs"
          python3 - "$RUNNER_TEMP/prefs/Atelier.plist" layout/Library/PreferenceLoader/Preferences/Atelier.plist <<'EOF'
          import plistlib, sys
          fresh, shipped = (plistlib.load(open(p, "rb")) for p in sys.argv[1:3])
          assert fresh == shipped, "layout/ is stale: run tools/make_prefs.py and commit the result"
          print("prefs OK:", [i["key"] for i in shipped["items"] if "key" in i])
          EOF
          python3 tools/layout_check.py | tail -1

      - name: Build the .deb (Xcode clang => versioned arm64e)
        run: |
          export THEOS="$HOME/theos"
          make clean || true
          set -o pipefail
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS="arm64 arm64e" 2>&1 | tee build.log
          ls -la packages/

      - name: Gate (versioned arm64e slice, system libraries only)
        run: |
          # the staged (fat) copies, not thin per-arch ones from .theos/obj/<arch>/
          # Atelier goes into SpringBoard, AtelierPrefs into Settings: both are arm64e processes
          for name in Atelier AtelierPrefs; do
            DY=$(find . -path "*DynamicLibraries/$name.dylib" | head -1)
            [ -n "$DY" ] || DY=.theos/obj/$name.dylib
            echo "dylib under test: $DY"
            lipo -detailed_info "$DY" || true
            python3 tools/verify_dylib.py "$DY"
            for arch in arm64 arm64e; do
              echo "--- $arch: links against ---"
              otool -arch $arch -L "$DY" || true
              echo "--- $arch: size ---"
              size -arch $arch "$DY" || true
            done
          done
          echo "--- what is in the package ---"
          mkdir -p "$RUNNER_TEMP/deb"
          (cd "$RUNNER_TEMP/deb" && ar x "$GITHUB_WORKSPACE"/packages/*.deb && ls -la && tar tvf data.tar.* && tar xOf control.tar.* ./control)
          echo "--- the postinst (it closes Settings, so the next start loads the new page and helper) ---"
          (cd "$RUNNER_TEMP/deb" && tar tvf control.tar.* && tar xOf control.tar.* ./postinst | tee postinst.txt)
          grep -q "killall -9 Preferences" "$RUNNER_TEMP/deb/postinst.txt"
          (cd "$RUNNER_TEMP/deb" && tar tvf control.tar.* | grep "postinst" | grep -q "^-rwx") || { echo "postinst is not executable"; exit 1; }
          if LC_ALL=C grep -q "$(printf '\015')" "$RUNNER_TEMP/deb/postinst.txt"; then echo "postinst has Windows line ends"; exit 1; fi

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-build-log-${{ matrix.runner }}
          path: build.log
          if-no-files-found: ignore

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: atelier-roothide-deb-${{ matrix.runner }}
          path: packages/*.deb

  # Atelier inside a simulator's SpringBoard, on the phone's iOS generation: real apps on the
  # bench, every layout, the swap, freezing, the sheets.
  simulator:
    if: ${{ !contains(github.event.head_commit.message, '[syntax only]') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain and simulator runtimes
        run: |
          xcodebuild -version || true
          xcrun simctl list runtimes || true

      - name: Get an iOS 16.4 simulator (the nearest to the phone's 16.5)
        # Without it the test still runs, on whatever iOS the runner has.
        continue-on-error: true
        timeout-minutes: 35
        run: |
          if xcrun simctl list runtimes | grep -q "iOS 16\.4"; then echo "already there"; exit 0; fi
          df -h / | tail -1
          xcodebuild -downloadPlatform iOS -buildVersion 16.4 || xcodebuild -downloadPlatform iOS -buildVersion 20E247 || true
          xcrun simctl list runtimes || true
          df -h / | tail -1

      - name: Run Atelier in a simulator's SpringBoard
        run: bash tools/sim_test.sh "$PWD/sim-out" 16.4

      - name: Upload pictures and logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-simulator-${{ matrix.runner }}
          path: |
            sim-out
            !sim-out/Atelier.dylib
            !sim-out/Atelier.dylib.dSYM
            !sim-out/AtelierProbe.app
            !sim-out/run
          if-no-files-found: ignore
