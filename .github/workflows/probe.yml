# Looks at the real thing: the Objective-C classes and the machine code of the firmware the tweak
# is for (iPhone 14 Pro Max = iPhone15,3, iOS 16.5, build 20F66), without a phone on the cable.
#
# For the frameworks in tools/probe.txt it dumps the headers of the listed classes; for the
# functions in tools/probe_symbols.txt it writes the disassembly. That is how the questions the
# simulator cannot answer are settled: is the menu's list view its collection view's delegate on
# 16.5, how is a separator view put together, what does applying layout attributes do to "hidden".
#
# Runs only when one of the two lists or this file changes. The result comes back as a
# short-lived artifact: gh run download <id> --name probe-20F66
name: Probe iOS 16.5 (20F66)
on:
  push:
    branches: [iwanttranslucent]
    paths:
      - tools/probe.txt
      - tools/probe_symbols.txt
      - .github/workflows/probe.yml
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install ipsw
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          # Homebrew refuses formulae from a tap it has not been told to trust; if it still will not
          # install ipsw, the ready-made binary from ipsw's own releases is used instead.
          brew tap blacktop/tap || true
          brew trust blacktop/tap || true
          if ! brew install blacktop/tap/ipsw; then
            echo "Homebrew could not install ipsw: taking the release binary"
            mkdir -p "$HOME/bin" "$RUNNER_TEMP/ipsw-dl"
            gh release download --repo blacktop/ipsw --pattern "ipsw_*_macOS_$(uname -m).tar.gz" --dir "$RUNNER_TEMP/ipsw-dl"
            tar xzf "$RUNNER_TEMP"/ipsw-dl/*.tar.gz -C "$RUNNER_TEMP/ipsw-dl"
            cp "$(find "$RUNNER_TEMP/ipsw-dl" -type f -name ipsw | head -1)" "$HOME/bin/ipsw"
            chmod +x "$HOME/bin/ipsw"
            echo "$HOME/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/bin:$PATH"
          fi
          ipsw version

      - name: Fetch the dyld shared cache (iPhone15,3 / 20F66)
        run: |
          mkdir -p "$RUNNER_TEMP/fw"
          cd "$RUNNER_TEMP/fw"
          ipsw download ipsw --device iPhone15,3 --build 20F66 --dyld --dyld-arch arm64e --confirm --output . < /dev/null
          find . -type f -exec ls -la {} + | head -60
          du -sh .

      - name: Dump headers
        run: |
          DSC=$(find "$RUNNER_TEMP/fw" -type f -name 'dyld_shared_cache_arm64e' | head -1)
          [ -n "$DSC" ] || { echo "no dyld_shared_cache_arm64e found"; exit 1; }
          echo "cache: $DSC"
          echo "DSC=$DSC" >> "$GITHUB_ENV"
          mkdir -p probe/headers
          grep -v '^#' tools/probe.txt | while read -r image filter; do
            [ -n "$image" ] || continue
            echo "::group::$image $filter"
            ipsw class-dump "$DSC" "$image" --headers --output "probe/headers/$image" --class "$filter" < /dev/null || echo "FAILED (headers): $image"
            n=$(find "probe/headers/$image" -name '*.h' 2>/dev/null | wc -l | tr -d ' ')
            echo "$n headers"
            if [ "$n" = "0" ]; then
              mkdir -p "probe/headers/$image"
              ipsw class-dump "$DSC" "$image" --class "$filter" --no-color < /dev/null > "probe/headers/$image/_dump.txt" 2>&1 || echo "FAILED (text): $image"
              wc -l "probe/headers/$image/_dump.txt" || true
            fi
            echo "::endgroup::"
          done
          du -sh probe/headers

      - name: Disassemble
        run: |
          mkdir -p probe/disasm probe/symbols probe/help
          ipsw dyld disass --help > probe/help/disass.txt 2>&1 || true
          ipsw dyld symaddr --help > probe/help/symaddr.txt 2>&1 || true
          # the symbols of each image once, then every wanted function by its address
          for image in $(grep -v '^#' tools/probe_symbols.txt | awk 'NF { print $1 }' | sort -u); do
            echo "symbols of $image"
            ipsw dyld symaddr "$DSC" --image "$image" --no-color < /dev/null > "$RUNNER_TEMP/sym-$image.txt" 2>> probe/symbols/_errors.txt || true
            wc -l "$RUNNER_TEMP/sym-$image.txt" || true
          done
          grep -E "ContextMenu|UICollectionReusableView " "$RUNNER_TEMP/sym-UIKitCore.txt" > probe/symbols/UIKitCore-menu.txt || true
          grep -E "MRURouting(TableViewCell|HeaderView)|MRUNowPlayingContainerView" "$RUNNER_TEMP/sym-MediaControls.txt" > probe/symbols/MediaControls.txt || true
          grep -E "CCUIMenuModuleItemView" "$RUNNER_TEMP/sym-ControlCenterUIKit.txt" > probe/symbols/ControlCenterUIKit.txt || true
          grep -v '^#' tools/probe_symbols.txt | while read -r image regex; do
            [ -n "$image" ] && [ -n "$regex" ] || continue
            RE="$regex" awk -F'\t' '$3 ~ ENVIRON["RE"] { a = $1; sub(":", "", a); print a "\t" $3 }' "$RUNNER_TEMP/sym-$image.txt" | while IFS=$'\t' read -r addr symbol; do
              safe=$(printf '%s' "$symbol" | tr -c 'A-Za-z0-9_.' '_' | cut -c1-110)
              out="probe/disasm/${image}__${safe}.txt"
              ipsw dyld disass "$DSC" --vaddr "$addr" --no-color < /dev/null > "$out" 2>&1 || echo "FAILED: $image $symbol"
              echo "$(wc -l < "$out" | tr -d ' ') lines  $image  $symbol"
            done
          done
          du -sh probe/disasm

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-20F66-${{ matrix.runner }}
          path: probe
          retention-days: 5
